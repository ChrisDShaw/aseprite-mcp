[project]
name = "aseprite-mcp"
version = "0.1.0"
description = "MCP server for creating and analyzing pixel art in Aseprite"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.6.0",
    "pillow>=10.1.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
